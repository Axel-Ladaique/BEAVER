<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AeroRib</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="entete">
    <h1>AeroRib</h1>
    <p class="projet-courant" id="projet-courant" aria-live="polite">Aucun projet ouvert</p>
  </header>
  <div id="bandeau" class="bandeau" role="alert" hidden></div>
  <nav class="onglets" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="onglet-projets" aria-controls="panneau-projets" data-onglet="projets">Projets</button>
    <button type="button" role="tab" id="onglet-reglages" aria-controls="panneau-reglages" data-onglet="reglages">Réglages</button>
    <button type="button" role="tab" id="onglet-apercu" aria-controls="panneau-apercu" data-onglet="apercu">Aperçu</button>
    <button type="button" role="tab" id="onglet-generer" aria-controls="panneau-generer" data-onglet="generer">Générer</button>
    <button type="button" role="tab" id="onglet-historique" aria-controls="panneau-historique" data-onglet="historique">Historique</button>
    <button type="button" role="tab" id="onglet-profils" aria-controls="panneau-profils" data-onglet="profils">Profils</button>
  </nav>
  <main>
    <section role="tabpanel" id="panneau-projets" aria-labelledby="onglet-projets" hidden></section>
    <section role="tabpanel" id="panneau-reglages" aria-labelledby="onglet-reglages" hidden></section>
    <section role="tabpanel" id="panneau-apercu" aria-labelledby="onglet-apercu" hidden></section>
    <section role="tabpanel" id="panneau-generer" aria-labelledby="onglet-generer" hidden></section>
    <section role="tabpanel" id="panneau-historique" aria-labelledby="onglet-historique" hidden></section>
    <section role="tabpanel" id="panneau-profils" aria-labelledby="onglet-profils" hidden></section>
  </main>
  <noscript>Cette interface nécessite JavaScript.</noscript>
</body>
</html>
