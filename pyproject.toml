[project]
name = "beaver"
version = "0.1.0"
description = "BEAVER — Bambu Engine for Aero Vase-mode Embedded Ribs"
requires-python = ">=3.12"
dependencies = [
  "build123d>=0.13",
  "numpy>=1.26",
  "trimesh>=4.0",
  "networkx>=3.0",
  "scipy>=1.11",
  "rtree>=1.0",
  "shapely>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.143.0",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
]

[project.scripts]
beaver = "beaver.cli:app"
aerorib = "beaver.cli:app"  # ancien nom, conservé comme alias

[project.urls]
Repository = "https://github.com/Axel-Ladaique/BEAVER"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beaver"]

[tool.hatch.build.targets.wheel.force-include]
"presets-bambu" = "beaver/presets-bambu"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests lents (slicing Bambu, grosses pièces)"]
