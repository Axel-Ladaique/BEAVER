# Profil matière BEAVER : ASA Aero (Bambu P1S).
# Fichier à modifier à volonté : les valeurs se règlent par essais d'impression.
# Pour garder vos modifications hors du paquet : « beaver profils --copier asa_aero »
# crée ./profiles/asa_aero.yaml, fusionné sur ce fichier : il ne change que les clés qu'il contient.
# Ordre de priorité : défauts du code < ce profil < config projet (-c) < options de ligne de commande.

material_settings:
  line_width: 0.42        # mm (valeur du PLA Aero, à ajuster pour l'ASA)
  layer_height: 0.2       # mm
  density: 0.7            # g/cm³ effective du filament imprimé (à recaler par pesée)
  min_slit_width: 0.10    # mm, en dessous le slicer referme la fente (slice_closing_radius 0,049)
  max_overhang_deg: 40    # inclinaison max des murs internes par rapport à Z

slit_width: 0.1           # épaisseur des nervures (mm) ; ≥ 1,1 × min_slit_width une fois vue en tranche

split:
  gap: 0.6                # bande de séparation entre nervures hautes et basses (≥ largeur de ligne)
  min_rib_depth: 1.0      # pas de nervure plus courte que ça (bords d'attaque / fuite)

rib_layers:
  - name: principal
    pattern: diamond
    spacing: 30           # mm entre nervures parallèles
    # angle: 45           # défaut = min(45, max_overhang_deg)
    # depth: full         # full ou profondeur en mm (≥ 2 × largeur de ligne)
    # phase: 0

spars:
  default:
    clearance: 0.15       # jeu radial autour du longeron
    sleeve: 0.8           # matière gardée autour du trou (≥ largeur de ligne)
    strip: 2.0
    slit_side: top        # top = extrados
    slit_width: 0.15      # ≥ 1,1 × min_slit_width
    anchor: true
    anchor_gap: 1.0       # ≥ largeur de ligne

passages:
  mode: fill              # fill | link | off
  sleeve: 0.8
  strip: 1.0
  slit_side: top
  slit_width: 0.15
  max_tilt_deg: 5.0
